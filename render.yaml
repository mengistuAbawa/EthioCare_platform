services:
  - type: web
    name: ethiocare-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_MODEL
        value: gpt-4o-mini
